name: Deploy to GitHub Pages

# Legacy mirror. The primary home is https://944.limitlezz.tech (own server,
# built with the repo defaults). This workflow pins the old Pages base/site so
# itslimitlezz.github.io/944-Hub keeps working until (and after) cutover.
env:
  PAGES_BASE: /944-Hub
  PAGES_SITE: https://itslimitlezz.github.io

on:
  # Deploy on every push to the default branch.
  push:
    branches: [main]
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

# Permissions needed for the GitHub Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Astro site
        uses: withastro/action@v4
        # Defaults are fine: installs deps, runs `astro build`, uploads ./dist
        # as the Pages artifact. The base path comes from astro.config.mjs.

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
